name: Build Custom IPA (Linux Fast)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Package IPA
    runs-on: ubuntu-latest # ИСПОЛЬЗУЕМ LINUX (мгновенный запуск)

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git make clang ldid xz-utils zip unzip curl python3-pip
        pip3 install lief # Библиотека для внедрения dylib на Linux

    - name: Clone Theos
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV

    - name: Download and Extract SDKs
      run: |
        mkdir -p $THEOS/sdks
        curl -L -o iPhoneOS.sdk.tar.xz https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
        tar -xf iPhoneOS.sdk.tar.xz -C $THEOS/sdks

    - name: Compile Tweak
      run: |
        make clean
        make package FINALPACKAGE=1

    - name: Extract and Inject Dylib
      run: |
        mkdir extracted
        unzip app.ipa -d extracted
        
        # Находим наш скомпилированный dylib
        DYLIB_PATH=$(find .theos/obj -name "*.dylib" | head -n 1)
        echo "Найден dylib: $DYLIB_PATH"
        
        # Копируем его в игру
        cp "$DYLIB_PATH" "extracted/Payload/GeometryDash.app/MyHack.dylib"
        
        # Внедряем зависимость от dylib с помощью Python-библиотеки LIEF
        python3 -c "
        import lief
        binary_path = 'extracted/Payload/GeometryDash.app/GeometryDash'
        dylib_path = '@executable_path/MyHack.dylib'
        print(f'Анализ бинарника: {binary_path}')
        binary = lief.parse(binary_path)
        binary.add_library(dylib_path)
        binary.write(binary_path)
        print('Dylib успешно внедрен в бинарник игры!')
        "

    - name: Package IPA
      run: |
        cd extracted
        # Упаковываем обратно в ipa (флаг -y сохраняет симлинки)
        zip -ry ../HackedGeometryDash.ipa Payload/
        echo "IPA-файл создан!"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Hacked-GeometryDash-IPA
        path: HackedGeometryDash.ipa
