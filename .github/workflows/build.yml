name: Build Custom IPA (Linux Fast)

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lief

      - name: Download MyApp.2.zip from Release
        run: |
          URL="https://github.com/hayrxdevofficial/my-ios-mod-for-gd/releases/download/Homer/MyApp.2.zip"
          echo "Downloading from: $URL"
          curl -L -o "MyApp_2.zip" "$URL"

      - name: Unpack Source Archive (Adaptive)
        run: |
          mkdir -p unpacked
          unzip -q MyApp_2.zip -d unpacked/
          echo "=== Content of unpacked archive ==="
          ls -l unpacked/

      - name: Locate Game .app Bundle
        id: locate_app
        run: |
          # 1. Ищем .app бандл напрямую (на случай, если архив — это уже IPA)
          APP_PATH=$(find unpacked/ -type d -name "*.app" | head -n 1)

          # 2. Если .app не найден, ищем вложенный zip (старая структура)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found directly, looking for nested zip..."
            NESTED_ZIP=$(find unpacked/ -name "*.zip" | head -n 1)
            if [ -n "$NESTED_ZIP" ]; then
              mkdir -p nested/
              unzip -q "$NESTED_ZIP" -d nested/
              APP_PATH=$(find nested/ -type d -name "*.app" | head -n 1)
            fi
          fi

          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find any .app bundle in the downloaded archive!"
            exit 1
          fi

          echo "Found .app bundle at: $APP_PATH"
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

      - name: Create Structure and Inject Geode.ios.dylib
        run: |
          mkdir -p ipa_structure/Payload
          cp -r "${{ steps.locate_app.outputs.app_path }}" ipa_structure/Payload/GeometryDash.app

          if [ -f "Geode.ios.dylib" ]; then
            cp Geode.ios.dylib ipa_structure/Payload/GeometryDash.app/
          else
            echo "Error: Geode.ios.dylib not found in repository root!"
            exit 1
          fi

          TARGET_BINARY=$(find ipa_structure/Payload/GeometryDash.app/ -maxdepth 1 -type f -executable | head -n 1)
          echo "Target binary found: $TARGET_BINARY"

          python -c "
          import lief
          binary = lief.parse('$TARGET_BINARY')
          binary.add_library('@executable_path/Geode.ios.dylib')
          binary.write('$TARGET_BINARY')
          print('Successfully injected Geode.ios.dylib into binary!')
          "

      - name: Pack Everything into Final IPA
        run: |
          cd ipa_structure
          zip -q -r ../GeometryDash_Geode_Personal.ipa Payload/
          cd ..
          echo "IPA packing completed successfully!"

      - name: Upload Modded IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeometryDash_Modded_IPA
          path: GeometryDash_Geode_Personal.ipa
