name: Build and Inject iOS Mod

on:
  workflow_dispatch:  # Ручной запуск
  push:
    branches: [ main ]  # Автозапуск при пуше в main

jobs:
  build:
    runs-on: macos-latest  # Theos-action требует macOS или Linux
    steps:
      # ------------------------------------------------------------
      # Шаг 1: Получаем код из репозитория
      # ------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Шаг 2: Настраиваем Theos (сборка .dylib)
      # ------------------------------------------------------------
      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      # ------------------------------------------------------------
      # Шаг 3: Собираем .dylib из нашего Tweak.xm
      # ------------------------------------------------------------
      - name: Build Tweak
        run: |
          make clean
          make package FINALPACKAGE=1
          # Ищем собранный .dylib в стандартной папке Theos
          find .theos -name "*.dylib" -print
          echo "DYLIB_PATH=$(find .theos -name '*.dylib' | head -1)" >> $GITHUB_ENV

      # ------------------------------------------------------------
      # Шаг 4: Скачиваем игру (ZIP) по вашей ссылке
      # ------------------------------------------------------------
      - name: Download Game Archive
        run: |
          curl -L -o game.zip "https://github.com/hayrxdevofficial/my-ios-mod-for-gd/releases/download/Homer/MyApp.2.zip"
          ls -lh game.zip

      # ------------------------------------------------------------
      # Шаг 5: Распаковываем архив (адаптивно: ZIP или IPA)
      # ------------------------------------------------------------
      - name: Unpack Game Archive
        run: |
          mkdir -p extracted
          if [[ "game.zip" == *.zip ]]; then
            unzip -o game.zip -d extracted
          fi
          # Ищем вложенные ZIP/IPA и распаковываем их тоже
          find extracted -type f \( -name "*.zip" -o -name "*.ipa" \) | while read -r nested; do
            echo "Unpacking nested: $nested"
            unzip -o "$nested" -d "${nested}_extracted"
          done
          # Показываем структуру для отладки
          find extracted -print | head -50

      # ------------------------------------------------------------
      # Шаг 6: Находим .app и исполняемый файл
      # ------------------------------------------------------------
      - name: Locate .app Bundle and Executable
        id: find_app
        run: |
          APP_PATH=$(find extracted -type d -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ .app не найден!"
            exit 1
          fi
          EXE_NAME=$(basename "$APP_PATH" .app)
          EXE_PATH="$APP_PATH/$EXE_NAME"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "EXE_PATH=$EXE_PATH" >> $GITHUB_ENV
          echo "✅ .app: $APP_PATH"
          echo "✅ Executable: $EXE_PATH"
          file "$EXE_PATH"

      # ------------------------------------------------------------
      # Шаг 7: Копируем .dylib внутрь .app
      # ------------------------------------------------------------
      - name: Copy Dylib into App Bundle
        run: |
          if [ -z "$DYLIB_PATH" ]; then
            echo "❌ DYLIB_PATH не установлен!"
            exit 1
          fi
          echo "Копируем $DYLIB_PATH в $APP_PATH/"
          cp "$DYLIB_PATH" "$APP_PATH/"
          ls -la "$APP_PATH"/*.dylib

      # ------------------------------------------------------------
      # Шаг 8: Внедряем .dylib в бинарник (LC_LOAD_DYLIB)
      # ------------------------------------------------------------
      - name: Inject Dylib into Binary
        run: |
          DYLIB_NAME=$(basename "$DYLIB_PATH")
          echo "Внедряем @executable_path/$DYLIB_NAME в $EXE_PATH"
          pip3 install lief
          python3 - <<'PY'
import lief
import os

exe_path = os.environ['EXE_PATH']
dylib_name = os.environ['DYLIB_NAME']

binary = lief.parse(exe_path)
binary.add_library(f'@executable_path/{dylib_name}')
binary.write(exe_path)
print('✅ Библиотека внедрена')
PY
          otool -L "$EXE_PATH" | grep -i "$DYLIB_NAME" || echo "⚠️ Проверка не удалась, но пробуем продолжить"
