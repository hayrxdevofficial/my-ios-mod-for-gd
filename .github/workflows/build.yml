name: Build Custom IPA (Linux Fast)

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lief

      - name: Download MyApp.2.zip from Release
        run: |
          URL="https://github.com/hayrxdevofficial/my-ios-mod-for-gd/releases/download/Homer/MyApp.2.zip"
          echo "Downloading from: $URL"
          curl -L -o "MyApp_2.zip" "$URL"
          ls -l MyApp_2.zip

      - name: Unpack Source Archive (Adaptive)
        run: |
          set -e
          mkdir -p unpacked
          unzip -q MyApp_2.zip -d unpacked/
          echo "=== Content of unpacked archive ==="
          ls -la unpacked/

      - name: Locate Game .app Bundle
        id: locate_app
        run: |
          set -e
          APP_PATH=$(find unpacked/ -type d -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "No .app directly, looking for nested MyApp.zip (file OR folder)..."
            NESTED=$(find unpacked/ -maxdepth 4 -name "MyApp.zip" | head -n 1)
            if [ -z "$NESTED" ]; then
              NESTED=$(find unpacked/ -maxdepth 4 -name "*.zip" | head -n 1)
            fi

            if [ -n "$NESTED" ]; then
              echo "Found nested: $NESTED"
              if [ -d "$NESTED" ]; then
                APP_PATH=$(find "$NESTED" -type d -name "*.app" | head -n 1)
              else
                mkdir -p nested/
                unzip -q "$NESTED" -d nested/
                APP_PATH=$(find nested/ -type d -name "*.app" | head -n 1)
              fi
            fi
          fi

          if [ -z "$APP_PATH" ]; then
            echo "Error: no .app bundle found. Content tree:"
            find unpacked/ -maxdepth 5 | head -100
            exit 1
          fi

          echo "Found .app: $APP_PATH"
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

      - name: Create Structure and Inject Geode.ios.dylib
        run: |
          set -e
          mkdir -p ipa_structure/Payload
          cp -a "${{ steps.locate_app.outputs.app_path }}" ipa_structure/Payload/GeometryDash.app

          APP_BUNDLE="ipa_structure/Payload/GeometryDash.app"

          BINARY_NAME=$(python3 -c "
          import plistlib
          try:
              with open('$APP_BUNDLE/Info.plist','rb') as f:
                  print(plistlib.load(f).get('CFBundleExecutable',''))
          except Exception:
              print('')
          ")

          if [ -z "$BINARY_NAME" ]; then
            BINARY_NAME=$(basename "${{ steps.locate_app.outputs.app_path }}" .app)
          fi

          TARGET_BINARY="$APP_BUNDLE/$BINARY_NAME"

          if [ ! -f "$TARGET_BINARY" ]; then
            echo "Binary '$TARGET_BINARY' not found, scanning for Mach-O..."
            TARGET_BINARY=$(find "$APP_BUNDLE/" -maxdepth 1 -type f -exec file {} \; \
              | grep -iE "mach-o" | head -n 1 | cut -d: -f1)
          fi

          if [ -z "$TARGET_BINARY" ] || [ ! -f "$TARGET_BINARY" ]; then
            echo "Error: could not locate main Mach-O binary."
            echo "Contents of $APP_BUNDLE:"
            ls -la "$APP_BUNDLE/"
            exit 1
          fi

          echo "Target binary: $TARGET_BINARY"
          chmod +x "$TARGET_BINARY"

          if [ ! -f "Geode.ios.dylib" ]; then
            echo "Error: Geode.ios.dylib not found in repository root!"
            exit 1
          fi
          cp Geode.ios.dylib "$APP_BUNDLE/"

          python -c "
          import lief
          binary = lief.parse('$TARGET_BINARY')
          if binary is None:
              raise SystemExit('lief failed to parse binary: $TARGET_BINARY')
          binary.add_library('@executable_path/Geode.ios.dylib')
          binary.write('$TARGET_BINARY')
          print('Successfully injected Geode.ios.dylib into binary!')
          "

      - name: Pack Everything into Final IPA
        run: |
          set -e
          cd ipa_structure
          zip -q -r ../GeometryDash_Geode_Personal.ipa Payload/
          cd ..
          ls -lh GeometryDash_Geode_Personal.ipa
          echo "IPA packing completed successfully!"

      - name: Upload Modded IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeometryDash_Modded_IPA
          path: GeometryDash_Geode_Personal.ipa
