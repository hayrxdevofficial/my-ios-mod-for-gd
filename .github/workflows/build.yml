name: Build Custom IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    name: Build and Package IPA
    runs-on: macos-13 # Используем macOS-раннер, необходимый для сборки под iOS

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Theos
      uses: Randomblock1/theos-action@v1

    - name: Install Dependencies
      run: |
        brew install ldid xz make

    - name: Compile Tweak
      run: |
        # Собираем твик в виде .dylib
        make clean
        make package FINALPACKAGE=1

    - name: Extract and Inject Dylib
      run: |
        # 1. Распаковываем оригинальный IPA
        mkdir extracted
        unzip app.ipa -d extracted
        
        # 2. Находим скомпилированный .dylib файл
        DYLIB_PATH=$(find .theos/obj -name "*.dylib" | head -n 1)
        echo "Найден dylib: $DYLIB_PATH"
        
        # 3. Копируем его внутрь приложения
        cp "$DYLIB_PATH" "extracted/Payload/GeometryDash.app/MyHack.dylib"
        
        # 4. Внедряем зависимость от нашей библиотеки в основной бинарник игры
        # Скачиваем утилиту insert_dylib
        git clone https://github.com/Tyilo/insert_dylib.git
        cd insert_dylib
        # Собираем утилиту
        xcodebuild -project insert_dylib.xcodeproj -configuration Release
        cd ..
        # Внедряем
        ./insert_dylib/build/Release/insert_dylib @executable_path/MyHack.dylib "extracted/Payload/GeometryDash.app/GeometryDash" --strip-codesig --inplace

    - name: Package IPA
      run: |
        # Запаковываем модифицированное приложение обратно в .ipa
        cd extracted
        zip -r ../HackedGeometryDash.ipa Payload/
        echo "IPA-файл создан!"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Hacked-GeometryDash-IPA
        path: HackedGeometryDash.ipa
