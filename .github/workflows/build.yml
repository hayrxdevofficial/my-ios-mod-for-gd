name: Build and Inject iOS Mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Theos and SDKs
        run: |
          set -e
          brew install ldid make p7zip
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

          export THEOS="$GITHUB_WORKSPACE/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          if [ ! -d "$THEOS" ]; then
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
          fi

          mkdir -p "$THEOS/sdks"
          if [ -z "$(ls -A "$THEOS/sdks" | grep -v '.keep')" ]; then
            cd "$THEOS/sdks"
            curl -L -o master.zip "https://github.com/theos/sdks/archive/refs/heads/master.zip"
            7z x master.zip -o./tmp
            mv tmp/sdks-master/*.sdk . 2>/dev/null || true
            rm -rf tmp master.zip
          fi

          echo "✅ Theos и SDK установлены"
          ls -la "$THEOS/sdks" | head

      - name: Build Tweak
        run: |
          make clean
          make package FINALPACKAGE=1
          DYLIB=$(find .theos -name "*.dylib" | head -1)
          if [ -z "$DYLIB" ]; then
            echo "❌ .dylib не найден после сборки"
            exit 1
          fi
          echo "✅ Собран: $DYLIB"
          echo "DYLIB_PATH=$DYLIB" >> "$GITHUB_ENV"

      - name: Download Game Archive
        run: |
          curl -L -o game.zip "https://github.com/hayrxdevofficial/my-ios-mod-for-gd/releases/download/Homer/MyApp.2.zip"
          ls -lh game.zip

      - name: Unpack Game Archive
        run: |
          mkdir -p extracted
          unzip -o game.zip -d extracted
          find extracted -type f \( -name "*.zip" -o -name "*.ipa" \) | while read -r nested; do
            echo "Unpacking nested: $nested"
            unzip -o "$nested" -d "${nested}_extracted"
          done
          echo "=== Структура после распаковки ==="
          find extracted -maxdepth 4 -print | head -80

      - name: Locate .app Bundle and Executable
        run: |
          APP_PATH=$(find extracted -type d -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ .app не найден"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          rm -f "$APP_PATH"/Geode.tmp*
          rm -f "$APP_PATH/CMakeLists.txt"
          echo "🧹 Убраны артефакты Geode/CMake"

          EXE_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist" 2>/dev/null || true)
          echo "📄 CFBundleExecutable: '$EXE_NAME'"

          EXE_PATH=""

          if [ -n "$EXE_NAME" ] && [ -f "$APP_PATH/$EXE_NAME" ]; then
            EXE_PATH="$APP_PATH/$EXE_NAME"
            echo "✅ Взят из Info.plist"
          fi

          if [ -z "$EXE_PATH" ]; then
            for candidate in GeometryJump GeometryOriginal; do
              if [ -f "$APP_PATH/$candidate" ]; then
                EXE_PATH="$APP_PATH/$candidate"
                echo "✅ Найден по имени: $candidate"
                break
              fi
            done
          fi

          if [ -z "$EXE_PATH" ]; then
            echo "⚠️ Стандартные имена не найдены. Полный список файлов в корне .app:"
            for f in "$APP_PATH"/*; do
              if [ -f "$f" ]; then
                printf "  %-40s → %s\n" "$(basename "$f")" "$(file -b "$f" 2>/dev/null || echo 'unknown')"
              fi
            done

            echo "🔎 Поиск любого Mach-O (кроме dylib/tmp/plist/txt)..."
            EXE_PATH=$(find "$APP_PATH" -maxdepth 1 -type f \
              ! -name "*.dylib" ! -name "*.tmp*" ! -name "*.plist" ! -name "*.txt" \
              -exec sh -c 'file -b "$1" | grep -qi "Mach-O" && echo "$1"' _ {} \; \
              | head -1)
          fi

          if [ -z "$EXE_PATH" ] || [ ! -f "$EXE_PATH" ]; then
            echo "❌ Исполняемый файл не найден"
            exit 1
          fi

          NEW_EXE_NAME=$(basename "$EXE_PATH")
          if [ "$EXE_NAME" != "$NEW_EXE_NAME" ]; then
            echo "🔧 Исправляем CFBundleExecutable: '$EXE_NAME' → '$NEW_EXE_NAME'"
            /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable $NEW_EXE_NAME" "$APP_PATH/Info.plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string $NEW_EXE_NAME" "$APP_PATH/Info.plist"
          fi

          echo "EXE_PATH=$EXE_PATH" >> "$GITHUB_ENV"
          echo "✅ .app: $APP_PATH"
          echo "✅ Executable: $EXE_PATH"
          file "$EXE_PATH"

      - name: Copy Dylib into App Bundle
        run: |
          DYLIB_NAME=$(basename "$DYLIB_PATH")
          echo "DYLIB_NAME=$DYLIB_NAME" >> "$GITHUB_ENV"
          cp "$DYLIB_PATH" "$APP_PATH/"
          ls -la "$APP_PATH"/*.dylib

      - name: Inject Dylib into Binary
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install lief
          python - <<'PY'
          import os
          import lief

          exe_path = os.environ["EXE_PATH"]
          dylib_name = os.environ["DYLIB_NAME"]
          lib_path = f"@executable_path/{dylib_name}"

          binary = lief.parse(exe_path)
          if binary is None:
              raise SystemExit(f"Не удалось разобрать Mach-O: {exe_path}")

          binary.add_library(lib_path)
          binary.write(exe_path)
          print(f"✅ Внедрено: {lib_path}")
          PY
          deactivate
          echo "=== Проверка команд загрузки ==="
          otool -L "$EXE_PATH" | grep -i "$DYLIB_NAME" || echo "⚠️ grep не нашёл, но продолжаем"

      - name: Fix Info.plist
        run: |
          PLIST="$APP_PATH/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Delete :CFBundleSupportedPlatforms" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Delete :MinimumOSVersion" "$PLIST" 2>/dev/null || true
            echo "✅ Info.plist обработан"
          else
            echo "⚠️ Info.plist не найден"
          fi

      - name: Remove Device Restrictions (UISupportedDevices)
        run: |
          PLIST="$APP_PATH/Info.plist"
          if [ -f "$PLIST" ]; then
            echo "🔓 Удаляем ограничение UISupportedDevices..."
            /usr/libexec/PlistBuddy -c "Delete :UISupportedDevices" "$PLIST" 2>/dev/null || true
            if /usr/libexec/PlistBuddy -c "Print :UISupportedDevices" "$PLIST" >/dev/null 2>&1; then
              echo "⚠️ Ключ всё ещё на месте, пробуем принудительно..."
              /usr/libexec/PlistBuddy -c "Delete :UISupportedDevices" "$PLIST" || true
            else
              echo "✅ UISupportedDevices удалён (или его не было)"
            fi
          else
            echo "⚠️ Info.plist не найден, пропускаем"
          fi

      # 🔽 НОВЫЙ ШАГ: Переподпись с DER entitlements 🔽
      - name: Re-sign with DER Entitlements
        run: |
          echo "🔏 Переподписываем приложение с DER entitlements..."
          # Переподписываем все вложенные фреймворки и плагины
          find "$APP_PATH" -name "*.framework" -o -name "*.dylib" -o -name "*.appex" | while read -r nested; do
            if [ -e "$nested" ]; then
              echo "  Подписываем: $nested"
              codesign -f -s - --generate-entitlement-der "$nested" 2>/dev/null || true
            fi
          done
          # Переподписываем основной .app bundle
          echo "  Подписываем: $APP_PATH"
          codesign -f -s - --generate-entitlement-der "$APP_PATH"
          # Проверяем версию CodeDirectory
          echo "=== Проверка подписи ==="
          codesign -dv "$APP_PATH" 2>&1 | grep -E "CodeDirectory|Signature" || true

      - name: Create Final IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r MyModdedGame.ipa Payload/
          ls -lh MyModdedGame.ipa

      - name: Upload Final IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyModdedGame-ipa
          path: MyModdedGame.ipa
          if-no-files-found: error
